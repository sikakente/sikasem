name: Deploy Mobile

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"

jobs:
  deploy:
    name: EAS Update
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Publish OTA update
        working-directory: mobile
        run: eas update --branch production --message "Deploy from main (${{ github.sha }})" --non-interactive
